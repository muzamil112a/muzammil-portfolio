<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Muhammad Muzammil — Junior AI Automation Engineer. A cinematic portfolio." />
    <meta name="theme-color" content="#05070a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Muzammil — AI Automation Engineer" />
    <meta
      property="og:description"
      content="In every fog... there is one who does not lose his way. A cinematic portfolio."
    />
    <meta property="og:image" content="/assets/images/scene-4-hub.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Muhammad Muzammil — AI Automation Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking (media=print swapped to all on load) — a plain
         stylesheet link here blocks first paint on this request; display=swap
         already avoids invisible text while it loads either way. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Inline (not the external bundle) so this paints immediately, before
         any JS has downloaded/parsed/executed — index.css itself only
         applies once the JS module graph that imports it has loaded, and on
         a real network (unlike localhost) that gap is a dead blank screen
         with zero feedback. This is pure CSS fallback content: React's
         createRoot().render() in main.jsx replaces #root's children on
         first render, so it simply disappears the instant the real
         Loading.jsx (with actual asset-preload progress) takes over. -->
    <style>
      .pre-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #05070a;
        color: #c9a227;
        font-family: Georgia, 'Times New Roman', serif;
        letter-spacing: 0.5em;
        font-size: 1.5rem;
      }
      .pre-boot span {
        opacity: 0.7;
        animation: pre-boot-pulse 1.8s ease-in-out infinite;
      }
      @keyframes pre-boot-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pre-boot span {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-boot"><span>MUZAMMIL</span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
